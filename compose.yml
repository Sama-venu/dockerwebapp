version: "3.9"

services:
  devopsdb:
    image: venusama/myproject:db-image
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - my_network

  application:
    image: venusama/myproject:app-image
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    depends_on:
      - devopsdb  
    networks:
      - my_network


networks:
  my_network:
    driver: overlay
      

      

